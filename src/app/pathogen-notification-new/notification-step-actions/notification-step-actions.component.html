@if (side() === 'left') {
  <button
    mat-stroked-button
    (click)="navigation.previous()"
    [disabled]="!navigation.canGoToPrevious()"
    class="btn navigate--color style back"
    id="btn-nav-action-back"
    mat-button
    type="button">
    <mat-icon class="btn__icon margin--right" fontIcon="arrow_back_ios" aria-hidden="true" />
    Zurück
  </button>
} @else {
  @if (showNext()) {
    <button
      class="btn navigate--color style forward"
      id="btn-nav-action-next"
      mat-button
      type="button"
      (click)="navigation.next()"
      [disabled]="!navigation.canGoToNext()">
      Weiter
      <mat-icon class="btn__icon margin-left" fontIcon="arrow_forward_ios" iconPositionEnd aria-hidden="true" />
    </button>
  }
  <button
    class="btn style dark--color"
    id="btn-send-notification"
    mat-button
    type="submit"
    (click)="notificationService.sendData()"
    [gemDemisAriaDisabled]="!notificationService.isFormValid()"
    [disableRipple]="!notificationService.isFormValid()">
    Abschicken
    <mat-icon class="btn__icon margin--left rotate" fontIcon="send" iconPositionEnd aria-hidden="true" />
  </button>
}

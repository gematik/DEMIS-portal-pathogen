<mat-drawer-container class="stepper-container">
  <mat-drawer class="tabs-navigation" mode="side" opened>
    <div class="side-content-without-footer">
      <div class="stepper-heading">
        <h1>{{ headingTitle() }}</h1>
        @if (headingDescription()) {
          <p>{{ headingDescription() }}</p>
        }
      </div>
      <div>
        <app-side-navigation-stepper [currentStep]="currentStep()"
          [steps]="steps()"
          [model]="model()"
         />
        <app-hexhexbutton (pasteHexHexData)="handleHexhexButtonClick()" />
        <gem-demis-paste-box (dataPasted)="handlePasteBoxClick($event)" />
      </div>
    </div>
    @if (FEATURE_FLAG_PORTAL_HEADER_FOOTER) {
      <gem-demis-forms-footer [featureFlagPortal]="FEATURE_FLAG_PORTAL_ACCESSIBILITY" [featureFlagFooterLink]="FEATURE_FLAG_FOOTER_LINKS_CORRECTION"/>
    }
  </mat-drawer>

  <mat-drawer-content>
    @if (FEATURE_FLAG_PORTAL_PAGE_STRUCTURE) {
      <div id="pathogen-tab-section-header" class="section-header">
        <gem-demis-section-header id="pathogen-tab-section-headline" [level]="1"
                                  [titleText]="currentStepHeadline()" />
      </div>
    } @else {
      <div id="pathogen-tab-section-header_deprecated" class="section-header_deprecated">
        <h1>{{ currentStepHeadline() }}</h1>
        <div class="oval-label">
          Schritt {{ currentStep() + 1 }} von {{ maxNumberOfSteps() }}
        </div>
      </div>
    }
    <div class="section-body">
      <ng-content />
    </div>
  </mat-drawer-content>
</mat-drawer-container>
